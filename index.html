<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MKPA 工具箱｜保險、理財及福利實用工具</title>
<meta name="description" content="MKPA 實用工具一覽：醫保對照、自願醫保保費、理賠數據、醫院指南、強積金、定期息口、長生津及公屋指南。">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Noto+Sans+HK:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===== MKPA 統一標準（由 _standard/mkpa.css 複製，修改請先改呢份再同步到各工具）===== */
:root{
  --mk-brand:#00A758; --mk-brand-ink:#00753E; --mk-brand-soft:#E6F6EE; --mk-brand-line:#B4E2C8;
  --mk-deep:#0E5E57; --mk-ink:#1D2B2A; --mk-muted:#5B6B6A;
  --mk-bg:#F6F9F8; --mk-surface:#FFFFFF; --mk-line:#E3E9E7;
  --mk-warn:#8A5B00; --mk-warn-soft:#FFF5DC; --mk-danger:#C62828; --mk-danger-soft:#FDECEC;
  --mk-sans:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --mk-num:"Barlow","Noto Sans HK",system-ui,sans-serif;
  --mk-max:1320px;                        /* 內容最闊 */
  --mk-gutter:clamp(16px,3vw,32px);       /* 兩邊留白：手機 16px → 桌面 32px */
  /* 分類色盤：主色（圓點、色條、圖表）／ -ink 白底寫字 ／ -soft 淺底 */
  --mk-cat-1:#3072D4; --mk-cat-1-ink:#3072D4; --mk-cat-1-soft:#F1F5FC;   /* 1 醫療／住院 */
  --mk-cat-2:#D86F35; --mk-cat-2-ink:#B95924; --mk-cat-2-soft:#FCF5F1;   /* 2 人壽／身故 */
  --mk-cat-3:#953CB3; --mk-cat-3-ink:#953CB3; --mk-cat-3-soft:#F8F1FA;   /* 3 危疾 */
  --mk-cat-4:#158E92; --mk-cat-4-ink:#138185; --mk-cat-4-soft:#EFF7F7;   /* 4 意外 */
  --mk-cat-5:#C29323; --mk-cat-5-ink:#926F1B; --mk-cat-5-soft:#FBF7F0;   /* 5 儲蓄／退休／強積金 */
  --mk-cat-6:#CD486B; --mk-cat-6-ink:#CB4266; --mk-cat-6-soft:#FCF2F5;   /* 6 癌症 */
  --mk-cat-7:#6F7377; --mk-cat-7-ink:#6F7377; --mk-cat-7-soft:#F5F5F5;   /* 7 中性／其他 */
  --mk-cat-8:#845C4A; --mk-cat-8-ink:#845C4A; --mk-cat-8-soft:#F6F4F2;   /* 8 後備 */
}
/* 分類 class：加喺元素上就用 var(--c) var(--c-ink) var(--c-soft) */
.mk-cat-1{--c:var(--mk-cat-1);--c-ink:var(--mk-cat-1-ink);--c-soft:var(--mk-cat-1-soft)}
.mk-cat-2{--c:var(--mk-cat-2);--c-ink:var(--mk-cat-2-ink);--c-soft:var(--mk-cat-2-soft)}
.mk-cat-3{--c:var(--mk-cat-3);--c-ink:var(--mk-cat-3-ink);--c-soft:var(--mk-cat-3-soft)}
.mk-cat-4{--c:var(--mk-cat-4);--c-ink:var(--mk-cat-4-ink);--c-soft:var(--mk-cat-4-soft)}
.mk-cat-5{--c:var(--mk-cat-5);--c-ink:var(--mk-cat-5-ink);--c-soft:var(--mk-cat-5-soft)}
.mk-cat-6{--c:var(--mk-cat-6);--c-ink:var(--mk-cat-6-ink);--c-soft:var(--mk-cat-6-soft)}
.mk-cat-7{--c:var(--mk-cat-7);--c-ink:var(--mk-cat-7-ink);--c-soft:var(--mk-cat-7-soft)}
.mk-cat-8{--c:var(--mk-cat-8);--c-ink:var(--mk-cat-8-ink);--c-soft:var(--mk-cat-8-soft)}
.mk-chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--c-soft);color:var(--c-ink);font-size:13px;font-weight:700}
.mk-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c)}
/* 版面外框：工具可以用自己嘅 class，但數值要一樣 */
.mk-wrap{width:100%;max-width:calc(var(--mk-max) + 2 * var(--mk-gutter));margin:0 auto;padding-left:var(--mk-gutter);padding-right:var(--mk-gutter);box-sizing:border-box}
/* 標題旁 icon */
.mk-logo{width:32px;height:32px;flex:none;display:block}
.mk-ecard{display:flex;align-items:center;gap:16px 24px;flex-wrap:wrap;margin:28px 0 0;padding:20px 22px;border-radius:14px;border:1px solid var(--mk-brand-line);background:var(--mk-brand-soft);font-family:var(--mk-sans);color:var(--mk-ink);text-align:left}
.mk-ecard-txt{flex:1;min-width:200px}
.mk-ecard-txt b{display:block;font-size:17px;font-weight:700;margin-bottom:2px;color:var(--mk-ink)}
.mk-ecard-txt span{color:var(--mk-muted);font-size:14.5px;line-height:1.55}
.mk-ecard-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;background:var(--mk-brand);color:#fff!important;font-weight:700;font-size:16px;text-decoration:none!important;white-space:nowrap}
.mk-ecard-btn:hover{background:var(--mk-brand-ink)}
.mk-ecard-qr{display:none}
.mk-copy{margin:14px 0 0;font-size:13px;color:var(--mk-muted);font-family:var(--mk-sans)}
.mk-print-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--mk-brand);background:var(--mk-surface);color:var(--mk-brand-ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.mk-print-btn:hover{background:var(--mk-brand-soft)}
.mk-print-head{display:none}
/* MKPA 工具箱連結（頁尾，電子名片同版權行之間；開新分頁；列印唔印） */
.mk-home-link{margin:16px 0 0;font-family:var(--mk-sans);font-size:14px;line-height:1.5}
.mk-home-link a{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.mk-home-link a:hover{text-decoration-thickness:2px}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .mk-no-print,.mk-print-btn,.mk-share-btn,.mk-toast,.mk-ecard-btn,.mk-home-link{display:none!important}
  .mk-header{position:static}
  .mk-ecard{break-inside:avoid;padding:10px 14px;margin-top:14px}
  .mk-ecard-qr{display:block}
  .mk-ecard-qr svg{width:22mm;height:22mm;display:block}
  .mk-ecard-txt span:after{content:"（掃描右方二維碼）"}
  .mk-print-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--mk-brand);padding:0 0 5px;margin:0 0 10px;font-family:var(--mk-sans);color:var(--mk-muted);font-size:9pt}
  .mk-print-head b{color:var(--mk-deep);font-size:11pt}
}
/* 頁頭：統一鎖住喺頂；第一行 icon + 工具名 + 按鈕 */
/* 頁頭（跟 claimsreport）：淺色底、深色字；第一行 icon＋工具名 → 分頁掣（名右邊）→ 右邊按鈕；平板同手機分頁掣落第二行、左右捲 */
.mk-header{position:sticky;top:0;z-index:50;background:var(--mk-bg);color:var(--mk-ink);border-bottom:1px solid var(--mk-line)}
.mk-bar{display:flex;align-items:center;gap:16px;min-height:60px}
.mk-title{display:flex;align-items:center;gap:10px;min-width:0;font-family:var(--mk-sans);font-weight:900;font-size:17px;white-space:nowrap;color:var(--mk-deep);text-decoration:none}
.mk-title span{overflow:hidden;text-overflow:ellipsis}
/* 工具名 + 細字簡介（兩行都擠喺 56px 頁頭入面） */
.mk-name{display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1.2}
.mk-sub{display:block;margin-top:2px;color:inherit;font-size:12px;font-weight:500;letter-spacing:0;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-header .mk-name{color:var(--mk-deep)}
.mk-header .mk-sub{color:var(--mk-muted);opacity:1}
/* 分頁掣／導覽：每粒加 .mk-tab 同 .mk-cat-N（或者自己設 --c、--c-ink）；選中用 .on／.active／aria-selected／aria-pressed／aria-current */
.mk-tabs{--c:var(--mk-brand);--c-ink:var(--mk-brand-ink);display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.mk-tabs::-webkit-scrollbar{display:none}
.mk-tab{display:inline-flex;align-items:center;gap:6px;flex:none;padding:6px 10px;border:0;border-radius:999px;background:none;color:#3C4A49;font-family:var(--mk-sans);font-size:14px;font-weight:500;line-height:1.4;white-space:nowrap;text-decoration:none;cursor:pointer;box-shadow:none}
.mk-tab::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;box-shadow:none;margin:0}
.mk-tab:hover{background:var(--mk-surface);color:var(--mk-ink);text-decoration:none}
.mk-tab.on,.mk-tab.active,.mk-tab[aria-selected="true"],.mk-tab[aria-pressed="true"],.mk-tab[aria-current="page"]{background:var(--c-ink);color:#fff;font-weight:700}
.mk-tab.on::before,.mk-tab.active::before,.mk-tab[aria-selected="true"]::before,.mk-tab[aria-pressed="true"]::before,.mk-tab[aria-current="page"]::before{background:#fff}
/* 平板同手機（≤1023px）：分頁掣落第二行，一行過左右捲 */
@media (max-width:1023px){.mk-bar{flex-wrap:wrap;row-gap:0;column-gap:10px;padding-top:8px}.mk-bar>.mk-title{flex:1}.mk-bar>.mk-tabs{order:3;flex:none;width:100%;margin:2px 0 6px}}
.mk-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
/* 分享呢個方案（同列印按鈕一樣樣式） */
.mk-share-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--mk-brand);background:var(--mk-surface);color:var(--mk-brand-ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.mk-share-btn:hover{background:var(--mk-brand-soft)}
.mk-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:999;background:var(--mk-ink);color:#fff;font:600 14px/1.4 var(--mk-sans);padding:10px 16px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:calc(100vw - 32px)}
.mk-share-btn>.mk-long{margin-left:-6px} /* 抵銷 gap，令「分享呢個方案」連埋 */
.mk-print-btn>.mk-long{margin-left:-2px} /* 「列印 / 存 PDF」保留一個空格 */
/* 手機：按鈕字縮短（「分享」「列印」） */
@media (max-width:480px){.mk-long{display:none}.mk-print-btn,.mk-share-btn{padding:0 10px}}
/* ===== MKPA 統一標準 完 ===== */

/* ===== 主頁 ===== */
*{box-sizing:border-box}
body{margin:0;background:var(--mk-bg);color:var(--mk-ink);font-family:var(--mk-sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--mk-brand-ink)}
.mk-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.mk-name{font-weight:700;font-size:17px}
.mk-actions{display:flex;gap:8px;flex:none}
.hero{padding:40px 0 8px}
.hero h1{margin:0 0 8px;font-size:clamp(26px,4vw,38px);line-height:1.25;color:var(--mk-deep);font-weight:900}
.hero p{margin:0;color:var(--mk-muted);max-width:720px}
.search{display:block;margin:22px 0 4px;position:relative;max-width:520px}
.search input{width:100%;height:48px;border:1px solid var(--mk-line);border-radius:12px;padding:0 16px 0 44px;font:inherit;background:#fff;color:var(--mk-ink)}
.search input:focus{outline:2px solid var(--mk-brand);outline-offset:1px;border-color:transparent}
.search svg{position:absolute;left:14px;top:14px;color:var(--mk-muted)}
.group{margin-top:34px}
.group h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:18px;color:var(--mk-ink)}
.group h2 i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.group h2 small{font-weight:500;color:var(--mk-muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tool{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--mk-line);border-radius:14px;padding:18px 18px 16px;color:var(--mk-ink);text-decoration:none;transition:box-shadow .15s,border-color .15s,transform .15s;break-inside:avoid}
.tool:hover{border-color:var(--mk-brand);box-shadow:0 6px 18px -10px rgba(14,94,87,.45);transform:translateY(-1px)}
.tool-top{display:flex;align-items:center;gap:12px}
.tool img{width:40px;height:40px;border-radius:10px;flex:none;background:var(--mk-brand)}
.tool b{display:block;font-size:17px;line-height:1.3}
.tool .sub{display:block;font-size:13px;color:var(--mk-muted)}
.tool p{margin:0;font-size:14.5px;color:#3C4A49;flex:1}
.tool .go{font-size:14px;font-weight:700;color:var(--mk-brand-ink)}
.tool .url{display:none}
.empty,.err{margin-top:28px;color:var(--mk-muted)}
footer{margin-top:56px;padding:8px 0 28px;border-top:1px solid var(--mk-line)}
footer .note{font-size:13px;color:var(--mk-muted);margin:18px 0 0}
.mk-copy{font-size:13px;color:var(--mk-muted);margin-top:18px}
@media (max-width:480px){.hero{padding-top:28px}.grid{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .search{display:none}
  .tool{border-color:#ccc;box-shadow:none;transform:none}
  .tool .go{display:none}
  .tool .url{display:block;font-size:9pt;color:#555;word-break:break-all}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  * {-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

var SRC = "https://raw.githubusercontent.com/mickoo129/mkpa-tools/main/tools.json";
var CAT = {1:"var(--mk-cat-1)",2:"var(--mk-cat-2)",3:"var(--mk-cat-3)",4:"var(--mk-cat-4)",5:"var(--mk-cat-5)",6:"var(--mk-cat-6)",7:"var(--mk-cat-7)",8:"var(--mk-cat-8)"};
var DATA = null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function safeUrl(u){return /^https:\/\//.test(u||"")?u:"#";}
function render(){
  var box=document.getElementById("list"), q=document.getElementById("q").value.trim().toLowerCase();
  var tools=DATA.tools.filter(function(t){return t.show!==false;});
  if(q) tools=tools.filter(function(t){return (t.name+t.sub+(t.desc||"")).toLowerCase().indexOf(q)>-1;});
  if(!tools.length){box.innerHTML='<p class="empty">搵唔到相關工具。</p>';return;}
  var groups=(DATA.groups||[]).concat([{id:"_other",name:"其他工具",cat:7}]), html="";
  groups.forEach(function(g){
    var ts=tools.filter(function(t){return g.id==="_other"?!DATA.groups.some(function(x){return x.id===t.group;}):t.group===g.id;});
    if(!ts.length) return;
    html+='<section class="group" style="--c:'+(CAT[g.cat]||CAT[7])+'"><h2><i></i>'+esc(g.name)+' <small>'+ts.length+' 個</small></h2><div class="grid">';
    ts.forEach(function(t){var u=safeUrl(t.url);

    html+='</div></section>';
  });

}

/* 分享呢個方案：手機彈出分享選單（WhatsApp 等），電腦複製連結。

function mkShare(url){
  url=url||location.href;
  if(navigator.share&&matchMedia('(pointer:coarse)').matches){navigator.share({title:document.title,url:url}).catch(function(){});return;}
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(
    function(){mkToast('已複製連結，客人撳開會見到同一個方案');},
    function(){window.prompt('複製呢條連結：',url);});
}
function mkToast(msg){var t=document.createElement('div');t.className='mk-toast';t.setAttribute('role','status');t.textContent=msg;(document.querySelector('dialog[open]')||document.body).appendChild(t);setTimeout(function(){t.remove();},2400);}
