name: MPF Wealth Terminal Engine

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Execute Bank-Grade Scraper
        run: |
          cd data-engine
          python scraper.py
          mkdir -p ../frontend/public/data
          cp output/mpf_master_data.json ../frontend/public/data/mpf_data.json

      - name: Deploy to Production
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Terminal Bot"
          git add frontend/public/data/mpf_data.json
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "🚀 Auto-Sync: Terminal Data Update (Cross-Year Verified)"
            git push origin main
          else
            echo "No data changes to commit."
          fi