name: Bank-Grade MPF Data Engine

on:
  # 每天香港時間 20:30 (UTC 12:30)
  schedule:
    - cron: '30 12 * * *'
  # 允許手動一鍵更新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pandas

      - name: Run Bank-Grade Engine
        run: |
          cd data-engine
          python scraper.py
          mkdir -p ../frontend/public/data
          cp output/mpf_master_data.json ../frontend/public/data/mpf_data.json

      - name: Commit and Push to Netlify
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Bank Grade Bot"
          git add frontend/public/data/mpf_data.json
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "📊 Auto-Sync: Bank Grade Data Update (HKT 20:30)"
            git push origin main
          else
            echo "No data changes to commit."
          fi