name: MPF Auto-Pilot Engine

on:
  # 每天香港時間 20:30 (UTC 12:30) 執行爬蟲
  schedule:
    - cron: '30 12 * * *'
  # 允許手動測試觸發
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pandas

      - name: Run Scraper and Generate Data
        run: |
          cd data-engine
          python scraper.py
          # 確保前端 public 目錄存在並移動 JSON
          mkdir -p ../frontend/public/data
          cp output/mpf_master_data.json ../frontend/public/data/mpf_data.json

      - name: Commit and Push Data Update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "MPF Auto-Pilot Bot"
          git add frontend/public/data/mpf_data.json
          
          # 偵測檔案是否有變更，有變更才 Push，避免報錯
          if ! git diff-index --quiet HEAD; then
            git commit -m "🤖 Auto-Sync: Update MPF Data (HKT 20:30)"
            git push origin main
          else
            echo "No data changes to commit."
          fi