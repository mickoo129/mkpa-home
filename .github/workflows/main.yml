name: MPF Auto-Pilot Engine

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 【終極強制安裝指令】直接話畀機器知要裝咩，唔使再靠 requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pandas

      - name: Run Scraper and Generate Data
        run: |
          cd data-engine
          python scraper.py
          mkdir -p ../frontend/public/data
          cp output/mpf_master_data.json ../frontend/public/data/mpf_data.json

      - name: Commit and Push Data Update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "MPF Auto-Pilot Bot"
          git add frontend/public/data/mpf_data.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "🤖 Auto-Sync: Update MPF Data"
            git push origin main
          else
            echo "No data changes to commit."
          fi